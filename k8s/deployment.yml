apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollit
  labels: {app: rollit}
spec:
  replicas: 2
  selector:
    matchLabels: {app: rollit}
  template:
    metadata:
      labels: {app: rollit}
    spec:
      containers:
        - name: rollit
          image: rollit:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: rollit-admin, key: token}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: rollit
spec:
  selector: {app: rollit}
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
